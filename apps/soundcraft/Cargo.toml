[package]
name = "soundcraft"
description = "SoundCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "soundcraft"

[lints]
workspace = true

[dependencies]
soundcraft-engine.workspace = true
soundcraft-ui-martensite.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
# Icon + VERSIONINFO for soundcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/soundcraft", dest = "/usr/bin/soundcraft", mode = "755" }
]
